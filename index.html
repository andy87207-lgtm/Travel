<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅GO — 旅遊行程規劃</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
:root{
  --bg-primary:#ffffff;--bg-secondary:#f5f5f0;--bg-tertiary:#ebebeb;
  --text-primary:#1a1a1a;--text-secondary:#6b6b6b;--text-tertiary:#9b9b9b;
  --border-light:rgba(0,0,0,0.1);--border-med:rgba(0,0,0,0.18);
  --green:#1D9E75;--green-light:#E1F5EE;--green-dark:#0F6E56;
  --blue-light:#E6F1FB;--blue:#185FA5;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px
}
@media(prefers-color-scheme:dark){
  :root{
    --bg-primary:#1e1e1e;--bg-secondary:#161616;--bg-tertiary:#121212;
    --text-primary:#f0f0f0;--text-secondary:#a0a0a0;--text-tertiary:#666;
    --border-light:rgba(255,255,255,0.1);--border-med:rgba(255,255,255,0.18);
    --green-light:#0a2e22;--blue-light:#0a1e33
  }
}

/* ── Layout ── */
.app{max-width:780px;margin:0 auto;min-height:100vh;background:var(--bg-secondary)}
.topbar{background:var(--bg-primary);border-bottom:0.5px solid var(--border-light);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-size:16px;font-weight:600;color:var(--text-primary)}
.logo-dot{color:var(--green)}
.user-pill{display:flex;align-items:center;gap:7px;padding:6px 13px;border:0.5px solid var(--border-med);border-radius:20px;cursor:pointer;font-size:12px;color:var(--text-secondary);background:var(--bg-primary);transition:border-color 0.15s}
.user-pill:hover{border-color:var(--green)}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--green-light);color:var(--green-dark);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center}
.nav{display:flex;background:var(--bg-primary);border-bottom:0.5px solid var(--border-light);padding:0 18px;overflow-x:auto}
.nav::-webkit-scrollbar{display:none}
.nb{padding:11px 15px;font-size:13px;border:none;background:none;color:var(--text-secondary);border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;white-space:nowrap;transition:color 0.15s}
.nb.on{color:var(--green);border-bottom-color:var(--green);font-weight:500}
.body{padding:16px 18px}
.view{display:none}.view.on{display:block}

/* ── Trips list ── */
.trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.trip-card{background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:14px;cursor:pointer;transition:border-color 0.15s,transform 0.1s}
.trip-card:hover{border-color:var(--green);transform:translateY(-1px)}
.trip-cover{height:66px;border-radius:var(--radius-sm);margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:30px}
.trip-name{font-size:14px;font-weight:500;color:var(--text-primary)}
.trip-sub{font-size:12px;color:var(--text-secondary);margin-top:3px}
.trip-badge{display:inline-block;margin-top:7px;padding:2px 9px;border-radius:20px;font-size:11px;background:var(--green-light);color:var(--green-dark)}
.add-trip-card{background:var(--bg-primary);border:0.5px dashed var(--border-med);border-radius:var(--radius-md);padding:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:152px;gap:9px;color:var(--text-tertiary);transition:border-color 0.15s,color 0.15s}
.add-trip-card:hover{border-color:var(--green);color:var(--green)}
.add-circle{width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}

/* ── Detail header ── */
.back-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--text-secondary);cursor:pointer;margin-bottom:12px;background:none;border:none;font-family:inherit;padding:0;transition:color 0.15s}
.back-btn:hover{color:var(--green)}
.detail-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.detail-title{font-size:18px;font-weight:600;color:var(--text-primary)}
.detail-sub{font-size:12px;color:var(--text-secondary);margin-top:3px}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap}
.stab{padding:5px 12px;font-size:12px;border:0.5px solid var(--border-med);border-radius:20px;cursor:pointer;background:none;color:var(--text-secondary);font-family:inherit;transition:all 0.15s}
.stab.on{background:var(--green);border-color:var(--green);color:#fff}

/* ── Day blocks ── */
.row-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.row-title{font-size:15px;font-weight:500;color:var(--text-primary)}
.day-block{background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);margin-bottom:10px;overflow:hidden}
.day-hd{padding:11px 14px;background:var(--bg-secondary);display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;transition:background 0.1s}
.day-hd:hover{background:var(--bg-tertiary)}
.day-num{width:26px;height:26px;border-radius:50%;background:var(--green-light);color:var(--green-dark);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.day-label{font-size:13px;font-weight:500;color:var(--text-primary)}
.day-date-lbl{font-size:11px;color:var(--text-secondary)}
.day-arr{font-size:11px;color:var(--text-tertiary);margin-left:auto;transition:transform 0.2s}
.day-body{border-top:0.5px solid var(--border-light)}

/* ── Spot rows ── */
.spot-row{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:0.5px solid var(--border-light);cursor:grab;user-select:none;transition:background 0.1s}
.spot-row:last-of-type{border-bottom:none}
.spot-row:hover{background:var(--bg-secondary)}
.spot-row.dragging{opacity:0.35;background:var(--green-light)}
.spot-row.drag-over{border-top:2px solid var(--green)}
.drag-handle{color:var(--text-tertiary);font-size:14px;flex-shrink:0;cursor:grab;padding:0 2px;line-height:1}
.spot-thumb{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.spot-info-col{flex:1;min-width:0}
.spot-name{font-size:13px;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot-meta{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}
.spot-time{font-size:11px;color:var(--text-secondary)}
.spot-note{font-size:11px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.spot-acts{display:flex;gap:4px;flex-shrink:0}
.btn-map{padding:4px 9px;font-size:11px;border:0.5px solid var(--green);color:var(--green);border-radius:20px;cursor:pointer;background:none;font-family:inherit;transition:background 0.1s}
.btn-map:hover{background:var(--green-light)}
.btn-sm{padding:4px 8px;font-size:11px;border:0.5px solid var(--border-med);color:var(--text-secondary);border-radius:var(--radius-sm);cursor:pointer;background:none;font-family:inherit;transition:background 0.1s}
.btn-sm:hover{background:var(--bg-secondary)}
.add-spot-row{padding:9px 14px;display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--text-tertiary);font-size:12px;border-top:0.5px dashed var(--border-light);transition:color 0.1s,background 0.1s}
.add-spot-row:hover{color:var(--green);background:var(--bg-secondary)}
.add-spot-plus{width:20px;height:20px;border-radius:50%;border:1px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;flex-shrink:0}

/* ── Hotel / Flight / Ledger ── */
.hotel-card{background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:13px 15px;margin-bottom:10px;display:flex;gap:11px;align-items:flex-start}
.hotel-icon{width:42px;height:42px;border-radius:var(--radius-sm);background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.hotel-name{font-size:13px;font-weight:500;color:var(--text-primary)}
.hotel-dates{font-size:12px;color:var(--text-secondary);margin-top:2px}
.hotel-addr{font-size:12px;color:var(--blue);margin-top:4px;cursor:pointer}
.hotel-addr:hover{text-decoration:underline}
.hbadge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;background:var(--green-light);color:var(--green-dark);margin-top:6px}
.hbadge.pending{background:#FAEEDA;color:#854F0B}
.flight-card{background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:13px 15px;margin-bottom:10px}
.flight-row{display:flex;align-items:center;gap:8px}
.f-ap{font-size:22px;font-weight:600;color:var(--text-primary)}
.f-mid{flex:1;text-align:center;position:relative}
.f-line{height:1px;background:var(--border-med)}
.f-dur{font-size:10px;color:var(--text-tertiary);position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--bg-primary);padding:0 5px;white-space:nowrap}
.f-time{font-size:12px;color:var(--text-secondary);margin-top:2px}
.f-meta{display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border-light);flex-wrap:wrap}
.f-detail{font-size:12px;color:var(--text-secondary)}
.f-detail span{color:var(--text-primary);font-weight:500}
.f-dir-badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;background:var(--blue-light);color:var(--blue)}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum-card{background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-sm);padding:12px}
.sum-lbl{font-size:11px;color:var(--text-secondary);margin-bottom:4px}
.sum-val{font-size:18px;font-weight:600;color:var(--text-primary)}
.sum-sub{font-size:10px;color:var(--text-tertiary);margin-top:2px}
.exp-row{background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-sm);padding:10px 13px;margin-bottom:8px;display:flex;align-items:center;gap:9px}
.exp-icon{width:32px;height:32px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.exp-name{font-size:13px;font-weight:500;color:var(--text-primary)}
.exp-meta{font-size:11px;color:var(--text-secondary)}
.pay-badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;margin-top:3px}
.pay-card-b{background:var(--blue-light);color:var(--blue)}
.pay-cash-b{background:#EAF3DE;color:#3B6D11}
.exp-amt{text-align:right;margin-left:auto;flex-shrink:0}
.exp-twn{font-size:13px;font-weight:500;color:var(--text-primary)}
.exp-orig{font-size:10px;color:var(--text-tertiary)}
.empty-state{text-align:center;padding:36px 20px;color:var(--text-tertiary);font-size:13px}

/* ── Buttons ── */
.btn-add{padding:7px 14px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;font-family:inherit;transition:background 0.15s}
.btn-add:hover{background:var(--green-dark)}

/* ── Modal ── */
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:100;align-items:flex-start;justify-content:center;padding:30px 16px}
.overlay.on{display:flex}
.modal{background:var(--bg-primary);border-radius:var(--radius-md);padding:20px 22px;width:340px;max-width:100%;position:relative;max-height:90vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:14px}
.fl{font-size:12px;color:var(--text-secondary);margin-bottom:4px;display:block}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.modal input,.modal select,.modal textarea{width:100%;font-size:13px;margin-bottom:10px;padding:8px 11px;border-radius:var(--radius-sm);border:0.5px solid var(--border-med);background:var(--bg-primary);color:var(--text-primary);font-family:inherit;outline:none;transition:border-color 0.15s}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--green)}
.modal textarea{height:56px;resize:none}
.mbtns{display:flex;gap:8px;margin-top:6px}
.btn-cancel{flex:1;padding:9px;border:0.5px solid var(--border-med);border-radius:var(--radius-sm);background:none;cursor:pointer;font-size:13px;color:var(--text-secondary);font-family:inherit;transition:background 0.1s}
.btn-cancel:hover{background:var(--bg-secondary)}
.btn-save{flex:1;padding:9px;background:var(--green);border:none;border-radius:var(--radius-sm);color:#fff;cursor:pointer;font-size:13px;font-family:inherit;transition:background 0.15s}
.btn-save:hover{background:var(--green-dark)}
.btn-del{flex:1;padding:9px;border:0.5px solid #E24B4A;border-radius:var(--radius-sm);background:none;cursor:pointer;font-size:13px;color:#E24B4A;font-family:inherit}
.btn-del:hover{background:#FCEBEB}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-tertiary);line-height:1}
.emoji-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.eopt{width:32px;height:32px;border-radius:var(--radius-sm);border:0.5px solid var(--border-light);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:border-color 0.1s,background 0.1s}
.eopt:hover{border-color:var(--green)}
.eopt.sel{border-color:var(--green);background:var(--green-light)}

/* ── Login screen ── */
.login-screen{text-align:center;padding:80px 24px}
.login-screen .big-icon{font-size:52px;margin-bottom:16px}
.login-screen h1{font-size:22px;font-weight:600;color:var(--text-primary);margin-bottom:8px}
.login-screen p{font-size:14px;color:var(--text-secondary);margin-bottom:30px}
.btn-google{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;background:var(--green);border:none;border-radius:var(--radius-sm);color:#fff;font-size:14px;cursor:pointer;font-family:inherit;font-weight:500;transition:background 0.15s}
.btn-google:hover{background:var(--green-dark)}
</style>
</head>
<body>
<div class="app" id="root">
  <div class="topbar">
    <div class="logo">旅<span class="logo-dot">GO</span></div>
    <div class="user-pill" id="upill" onclick="doLogin()">
      <div class="avatar" id="uav">G</div>
      <span id="uname">以 Google 登入</span>
    </div>
  </div>
  <div class="nav" id="mainnav" style="display:none">
    <button class="nb on" onclick="switchNav(this)">我的行程</button>
  </div>
  <div class="body">

    <!-- Login -->
    <div id="view-login" class="view on">
      <div class="login-screen">
        <div class="big-icon">✈️</div>
        <h1>旅GO</h1>
        <p>登入後開始規劃你的旅程，行程 · 住宿 · 航班 · 記帳一次搞定</p>
        <button class="btn-google" onclick="doLogin()">以 Google 帳號登入</button>
      </div>
    </div>

    <!-- Trip list -->
    <div id="view-trips" class="view">
      <div class="row-hd" style="margin-bottom:14px">
        <div class="row-title">我的行程</div>
      </div>
      <div class="trips-grid" id="trips-grid"></div>
    </div>

    <!-- Trip detail -->
    <div id="view-detail" class="view">
      <button class="back-btn" onclick="goBack()">← 返回行程列表</button>
      <div class="detail-hd">
        <div>
          <div class="detail-title" id="detail-title"></div>
          <div class="detail-sub" id="detail-sub"></div>
        </div>
        <div class="sub-tabs">
          <button class="stab on" onclick="switchSub('itinerary',this)">行程</button>
          <button class="stab" onclick="switchSub('hotel',this)">住宿</button>
          <button class="stab" onclick="switchSub('flight',this)">航班</button>
          <button class="stab" onclick="switchSub('ledger',this)">記帳</button>
        </div>
      </div>
      <div id="sub-itinerary" class="subview"></div>
      <div id="sub-hotel" class="subview" style="display:none"></div>
      <div id="sub-flight" class="subview" style="display:none"></div>
      <div id="sub-ledger" class="subview" style="display:none"></div>
    </div>

  </div>
</div>

<!-- Modal overlay -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal-box"></div>
</div>

<script>
var S={trips:[],cur:null,selEmoji:'🗾',drag:{srcDay:null,srcIdx:null}};
var WDAYS=['日','一','二','三','四','五','六'];
var TEMOJIS=['🗾','🏔','🌸','🏖','🏯','🍜','🌃','🦌','🌊','🎌','🏝','🗼'];
var SEMOJIS=['📍','⛩️','🍜','🏯','🛍️','🌸','🚢','🎡','🏖','🦌','🎌','☕','🏔','🎭','🌿','🎑','🚠','🍣','🍦','🏟'];
var CICONS={交通:'🚌',住宿:'🏨',餐飲:'🍜',購物:'🛍️',景點:'⛩️',其他:'📝'};
var CBGS={交通:'#E1F5EE',住宿:'#E6F1FB',餐飲:'#FAEEDA',購物:'#FAECE7',景點:'#EAF3DE',其他:'#F1EFE8'};
var JPY_RATE=0.226;

var SAMPLE=[
  {id:1,name:'北海道 5 天 4 夜',emoji:'🏔',startDate:'2025-07-10',days:5,nights:4,
   spots:{
     1:[{name:'新千歲機場入境',emoji:'✈️',time:'10:00',end:'11:30',note:'領行李、換匯'},
        {name:'薄野拉麵街',emoji:'🍜',time:'13:00',end:'14:30',note:'一蘭拉麵必吃'}],
     2:[{name:'旭山動物園',emoji:'🐧',time:'09:00',end:'12:00',note:'企鵝散步 10:00 開始'},
        {name:'富良野薰衣草田',emoji:'💜',time:'14:00',end:'17:00',note:'7月花季正盛'}],
     3:[{name:'小樽運河',emoji:'🚢',time:'09:00',end:'11:00',note:'早晨人少好拍照'},
        {name:'北一哨子館',emoji:'🕯',time:'11:30',end:'13:00',note:'玻璃工藝品'}],
     4:[{name:'大通公園',emoji:'🌿',time:'10:00',end:'12:00',note:'啤酒祭季節'}],
     5:[{name:'狸小路購物',emoji:'🛍️',time:'09:00',end:'11:00',note:'最後採購藥妝'},
        {name:'新千歲機場出發',emoji:'✈️',time:'13:30',end:'15:00',note:'提早2小時到'}]
   },
   hotels:[
     {name:'札幌 JR 塔飯店',icon:'🏨',checkin:'2025-07-10',checkout:'2025-07-13',addr:'北海道札幌市中央区北5条西2丁目',confirmed:true},
     {name:'函館皇家飯店',icon:'🏩',checkin:'2025-07-13',checkout:'2025-07-14',addr:'北海道函館市若松町14-10',confirmed:true}
   ],
   flights:[
     {from:'TPE',to:'CTS',dep:'07:25',arr:'11:30',date:'2025-07-10',no:'CI 151',seat:'23A',cabin:'經濟艙',dur:'3h 05m',dir:'去程'},
     {from:'CTS',to:'TPE',dep:'14:15',arr:'16:15',date:'2025-07-14',no:'CI 152',seat:'24A',cabin:'經濟艙',dur:'3h 00m',dir:'回程'}
   ],
   expenses:[
     {name:'機票（去回）',icon:'✈️',cat:'交通',pay:'card',amount:18000,orig:'TWD 18,000',date:'2025-07-10'},
     {name:'飯店（4晚）',icon:'🏨',cat:'住宿',pay:'card',amount:12000,orig:'TWD 12,000',date:'2025-07-10'},
     {name:'薄野拉麵',icon:'🍜',cat:'餐飲',pay:'cash',amount:860,orig:'¥ 3,800',date:'2025-07-10'},
     {name:'藥妝購物',icon:'🛍️',cat:'購物',pay:'cash',amount:6800,orig:'¥ 30,000',date:'2025-07-11'},
     {name:'JR Pass 7日券',icon:'🚄',cat:'交通',pay:'cash',amount:6700,orig:'TWD 6,700',date:'2025-07-10'}
   ]
  },
  {id:2,name:'沖繩 4 天 3 夜',emoji:'🌊',startDate:'2025-09-05',days:4,nights:3,
   spots:{1:[],2:[],3:[],4:[]},hotels:[],flights:[],expenses:[]}
];

/* ── Auth ── */
function doLogin(){
  S.trips=JSON.parse(JSON.stringify(SAMPLE));
  document.getElementById('uav').textContent='明';
  document.getElementById('uname').textContent='旅行者 小明';
  document.getElementById('mainnav').style.display='flex';

/* ── Trips list ── */

  S.trips.forEach(function(t){

    e.setDate(e.getDate()+t.days-1);

function openTrip(id){
  var trip=S.trips.find(function(t){return t.id===id;});

  S.cur=trip;
  document.getElementById('detail-title').textContent=trip.name;
  var s=new Date(trip.startDate),e=new Date(trip.startDate);
  e.setDate(e.getDate()+trip.days-1);

    (s.getMonth()+1)+'/'+s.getDate()+' – '+(e.getMonth()+1)+'/'+e.getDate()+

  document.querySelectorAll('.subview').forEach(function(v,i){v.style.display=i===0?'block':'none';});

}

/* ── Sub-tabs ── */
function switchSub(id,btn){
  document.querySelectorAll('.stab').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  document.querySelectorAll('.subview').forEach(function(v){v.style.display='none';});
  document.getElementById('sub-'+id).style.display='block';
  var trip=S.cur;
  if(!trip)return;
  if(id==='hotel')renderHotels(trip);
  else if(id==='flight')renderFlights(trip);
  else if(id==='ledger')renderLedger(trip);
  else renderDays(trip);
}

/* ── Itinerary ── */
function renderDays(trip){
  var c=document.getElementById('sub-itinerary');
  var html='';
  var start=new Date(trip.startDate);
  for(var d=1;d<=trip.days;d++){
    var dd=new Date(start);dd.setDate(dd.getDate()+d-1);
    var dlbl=(dd.getMonth()+1)+'/'+(dd.getDate())+'（'+WDAYS[dd.getDay()]+'）';
    var spots=trip.spots[d]||[];
    var sh='';
    spots.forEach(function(s,si){
      sh+='<div class="spot-row" draggable="true" data-day="'+d+'" data-idx="'+si+'"'+
        ' ondragstart="dndStart(event,'+d+','+si+')"'+
        ' ondragover="dndOver(event)"'+
        ' ondrop="dndDrop(event,'+d+','+si+','+trip.id+')"'+
        ' ondragend="dndEnd(event)">'+
        '<span class="drag-handle">⠿</span>'+
        '<div class="spot-thumb">'+s.emoji+'</div>'+
        '<div class="spot-info-col">'+
          '<div class="spot-name">'+escHtml(s.name)+'</div>'+
          '<div class="spot-meta">'+
            '<span class="spot-time">'+s.time+' – '+s.end+'</span>'+
            (s.note?'<span class="spot-note">'+escHtml(s.note)+'</span>':'')+
          '</div>'+
        '</div>'+
        '<div class="spot-acts">'+
          '<button class="btn-map" onclick="openMap(\''+escQ(s.name)+'\')">地圖</button>'+
          '<button class="btn-sm" onclick="openEditSpot('+trip.id+','+d+','+si+')">編輯</button>'+
        '</div>'+
      '</div>';
    });
    html+='<div class="day-block">'+
      '<div class="day-hd" onclick="toggleDay(this)">'+
        '<div class="day-num">'+d+'</div>'+
        '<div style="flex:1">'+
          '<div class="day-label">第 '+d+' 天</div>'+
          '<div class="day-date-lbl">'+dlbl+'</div>'+
        '</div>'+
        '<div class="day-arr">▾</div>'+
      '</div>'+
      '<div class="day-body" data-day="'+d+'" data-tripid="'+trip.id+'">'+
        sh+
        '<div class="add-spot-row" onclick="openAddSpot('+trip.id+','+d+')">'+
          '<div class="add-spot-plus">+</div>新增景點'+
        '</div>'+
      '</div>'+
    '</div>';
  }
  c.innerHTML=html;
}

function toggleDay(el){
  var body=el.nextElementSibling;
  var arr=el.querySelector('.day-arr');
  if(body.style.display==='none'){body.style.display='block';arr.textContent='▾';}
  else{body.style.display='none';arr.textContent='▸';}
}

/* ── Drag & Drop ── */
function dndStart(e,day,idx){
  S.drag={srcDay:day,srcIdx:idx};
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
}
function dndOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';}
function dndDrop(e,day,idx,tripId){
  e.preventDefault();
  var trip=S.trips.find(function(t){return t.id===tripId;});if(!trip)return;
  var sd=S.drag.srcDay,si=S.drag.srcIdx;
  if(sd===day&&si===idx)return;
  var srcSpots=trip.spots[sd]||[];
  var tgtSpots=trip.spots[day]||[];
  var item=srcSpots.splice(si,1)[0];
  if(sd===day){srcSpots.splice(idx,0,item);}
  else{tgtSpots.splice(idx,0,item);}
  trip.spots[sd]=srcSpots;trip.spots[day]=tgtSpots;
  renderDays(trip);
}
function dndEnd(e){e.currentTarget.classList.remove('dragging');}

      html+='<div class="exp-row">'+
        '<div class="exp-icon" style="background:'+bg+'">'+e.icon+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div class="exp-name">'+escHtml(e.name)+'</div>'+
          '<div class="exp-meta">'+e.date+' · '+e.cat+'</div>'+
          '<span class="pay-badge '+(e.pay==='card'?'pay-card-b':'pay-cash-b')+'">'+(e.pay==='card'?'刷卡':'現金')+'</span>'+
        '</div>'+
        '<div class="exp-amt">'+
          '<div class="exp-twn">NT$'+e.amount.toLocaleString()+'</div>'+
          '<div class="exp-orig">'+e.orig+'</div>'+
        '</div>'+
        '<button class="btn-sm" onclick="delExp('+trip.id+','+ei+')" style="margin-left:6px;flex-shrink:0">✕</button>'+
      '</div>';
    });
  }
  c.innerHTML=html;
}

function openAddExp(tripId){
  document.getElementById('modal-box').innerHTML=
    '<button class="close-x" onclick="closeModal()">✕</button>'+
    '<h3>新增支出</h3>'+
    '<span class="fl">項目名稱</span>'+
    '<input type="text" id="e-name" placeholder="例：拉麵、門票、藥妝">'+
    '<div class="frow">'+
      '<div><span class="fl">幣別</span><select id="e-cur" style="margin-bottom:0"><option value="TWD">台幣（TWD）</option><option value="JPY">日幣（JPY）</option></select></div>'+
      '<div><span class="fl">金額</span><input type="number" id="e-amt" placeholder="0" min="0" style="margin-bottom:0"></div>'+
    '</div><div style="height:6px"></div>'+
    '<div class="frow">'+
      '<div><span class="fl">付款方式</span><select id="e-pay" style="margin-bottom:0"><option value="card">刷卡</option><option value="cash">現金</option></select></div>'+
      '<div><span class="fl">類別</span><select id="e-cat" style="margin-bottom:0"><option>交通</option><option>住宿</option><option>餐飲</option><option>購物</option><option>景點</option><option>其他</option></select></div>'+
    '</div><div style="height:6px"></div>'+
    '<span class="fl">日期</span>'+
    '<input type="date" id="e-date">'+
    '<span class="fl">備註（選填）</span>'+
    '<input type="text" id="e-note" placeholder="地點或說明">'+
    '<div style="background:#E1F5EE;border-radius:8px;padding:8px 10px;font-size:11px;color:#0F6E56;margin-bottom:10px">💡 日幣將依匯率 0.226 自動換算為台幣</div>'+
    '<div class="mbtns">'+
      '<button class="btn-cancel" onclick="closeModal()">取消</button>'+
      '<button class="btn-save" onclick="saveExp('+tripId+')">加入</button>'+
    '</div>';
  document.getElementById('overlay').classList.add('on');
}

function saveExp(tripId){
  var name=document.getElementById('e-name').value.trim();
  var date=document.getElementById('e-date').value;
  if(!name||!date){alert('請填寫名稱與日期');return;}
  var amt=parseFloat(document.getElementById('e-amt').value)||0;
  var cur=document.getElementById('e-cur').value;
  var pay=document.getElementById('e-pay').value;
  var cat=document.getElementById('e-cat').value;
  var twd=cur==='JPY'?Math.round(amt*JPY_RATE):Math.round(amt);
  var orig=cur==='JPY'?('¥ '+Math.round(amt).toLocaleString()):('TWD '+Math.round(amt).toLocaleString());
  var trip=S.trips.find(function(t){return t.id===tripId;});
  trip.expenses.push({name:name,icon:CICONS[cat]||'📝',cat:cat,pay:pay,amount:twd,orig:orig,date:date});
  closeModal();renderLedger(trip);
}

function delExp(tripId,idx){
  var trip=S.trips.find(function(t){return t.id===tripId;});
  trip.expenses.splice(idx,1);renderLedger(trip);
}

/* ── Helpers ── */
function escHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s){return escHtml(s);}
function escQ(s){return String(s||'').replace(/'/g,"\\'");}
