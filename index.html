<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>旅GO — 旅遊行程規劃</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
:root{--bg:#fff;--bg2:#f5f5f0;--bg3:#e8e8e3;--t1:#1a1a1a;--t2:#6b6b6b;--t3:#9b9b9b;--bd:rgba(0,0,0,0.1);--bd2:rgba(0,0,0,0.2);--green:#1D9E75;--gl:#E1F5EE;--gd:#0F6E56;--blue:#185FA5;--bl:#E6F1FB;--r1:8px;--r2:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1e1e1e;--bg2:#161616;--bg3:#121212;--t1:#f0f0f0;--t2:#a0a0a0;--t3:#666;--bd:rgba(255,255,255,0.1);--bd2:rgba(255,255,255,0.2);--gl:#0a2e22;--bl:#0a1e33}}
.app{max-width:800px;margin:0 auto;min-height:100vh;background:var(--bg2)}
.topbar{background:var(--bg);border-bottom:0.5px solid var(--bd);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-size:16px;font-weight:700;color:var(--t1)}.logo span{color:var(--green)}
.user-pill{display:flex;align-items:center;gap:6px;padding:5px 12px;border:0.5px solid var(--bd2);border-radius:20px;cursor:pointer;font-size:12px;color:var(--t2);background:var(--bg);transition:border-color .15s}
.user-pill:hover{border-color:var(--green)}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--gl);color:var(--gd);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.nav{display:flex;background:var(--bg);border-bottom:0.5px solid var(--bd);padding:0 16px;overflow-x:auto}
.nav::-webkit-scrollbar{display:none}
.nb{padding:10px 13px;font-size:13px;border:none;background:none;color:var(--t2);border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;white-space:nowrap;transition:color .15s;flex-shrink:0}
.nb.on{color:var(--green);border-bottom-color:var(--green);font-weight:600}
.body{padding:14px 16px}
.view{display:none}.view.on{display:block}
.subview{display:none}.subview.on{display:block}

/* Login */
.login-screen{text-align:center;padding:70px 24px}
.login-screen .big-icon{font-size:52px;margin-bottom:14px}
.login-screen h1{font-size:24px;font-weight:700;color:var(--t1);margin-bottom:8px}
.login-screen p{font-size:14px;color:var(--t2);margin-bottom:32px;line-height:1.7}
.btn-google{display:inline-flex;align-items:center;gap:10px;padding:13px 28px;background:var(--green);border:none;border-radius:var(--r1);color:#fff;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600;transition:background .15s}
.btn-google:hover{background:var(--gd)}
.btn-google svg{width:18px;height:18px}

/* Trips */
.trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media(max-width:480px){.trips-grid{grid-template-columns:repeat(2,1fr)}}
.trip-card{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--r2);padding:13px;cursor:pointer;transition:border-color .15s,transform .1s;position:relative}
.trip-card:hover{border-color:var(--green);transform:translateY(-1px)}
.trip-cover{height:62px;border-radius:var(--r1);margin-bottom:9px;display:flex;align-items:center;justify-content:center;font-size:28px}
.trip-name{font-size:13px;font-weight:600;color:var(--t1);line-height:1.3}
.trip-sub{font-size:11px;color:var(--t2);margin-top:3px}
.trip-badge{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:20px;font-size:10px;background:var(--gl);color:var(--gd)}
.add-trip-card{background:var(--bg);border:0.5px dashed var(--bd2);border-radius:var(--r2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:148px;gap:8px;color:var(--t3);transition:all .15s}
.add-trip-card:hover{border-color:var(--green);color:var(--green)}
.add-circle{width:32px;height:32px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:20px}
.card-menu-btn{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--bg2);border:0.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:var(--t2);z-index:2;line-height:1}
.card-menu-btn:hover{background:var(--bg3);border-color:var(--bd2)}
.card-dropdown{position:absolute;top:34px;right:8px;background:var(--bg);border:0.5px solid var(--bd2);border-radius:var(--r1);box-shadow:0 4px 16px rgba(0,0,0,0.12);z-index:20;min-width:110px;overflow:hidden;display:none}
.card-dropdown.open{display:block}
.card-dropdown-item{padding:9px 14px;font-size:13px;cursor:pointer;color:var(--t1);display:flex;align-items:center;gap:7px}
.card-dropdown-item:hover{background:var(--bg2)}
.card-dropdown-item.danger{color:#E24B4A}
.card-dropdown-item.danger:hover{background:#FCEBEB}

/* Detail */
.back-btn{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--t2);cursor:pointer;margin-bottom:11px;background:none;border:none;font-family:inherit;padding:0}
.back-btn:hover{color:var(--green)}
.detail-title{font-size:18px;font-weight:700;color:var(--t1)}
.detail-sub{font-size:12px;color:var(--t2);margin-top:2px}
.detail-actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:8px}
.sub-tabs{display:flex;gap:5px;flex-wrap:wrap}
.stab{padding:5px 11px;font-size:12px;border:0.5px solid var(--bd2);border-radius:20px;cursor:pointer;background:none;color:var(--t2);font-family:inherit;transition:all .15s}
.stab.on{background:var(--green);border-color:var(--green);color:#fff}
.action-btns{display:flex;gap:6px;flex-wrap:wrap}
.icon-btn{display:flex;align-items:center;gap:4px;padding:5px 10px;font-size:12px;border:0.5px solid var(--bd2);border-radius:20px;cursor:pointer;background:var(--bg);color:var(--t2);font-family:inherit;transition:all .15s;white-space:nowrap}
.icon-btn:hover{border-color:var(--green);color:var(--green)}

/* Day blocks */
.row-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.row-title{font-size:15px;font-weight:600;color:var(--t1)}
.day-block{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--r2);margin-bottom:9px;overflow:hidden}
.day-hd{padding:10px 13px;background:var(--bg2);display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.day-num{width:24px;height:24px;border-radius:50%;background:var(--gl);color:var(--gd);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.day-label{font-size:13px;font-weight:600;color:var(--t1)}
.day-date-lbl{font-size:11px;color:var(--t2)}
.day-arr{font-size:11px;color:var(--t3);margin-left:auto}
.weather-chip{display:flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:10px;background:var(--bl);color:var(--blue);margin-left:6px;flex-shrink:0}
.day-body{border-top:0.5px solid var(--bd)}
.spot-row{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:0.5px solid var(--bd);user-select:none}
.spot-row:last-of-type{border-bottom:none}
.spot-row.draggable{cursor:grab}
.spot-row.dragging{opacity:0.35;background:var(--gl)}
.spot-row.drag-over{border-top:2px solid var(--green)}
.drag-handle{color:var(--t3);font-size:14px;flex-shrink:0;padding:0 1px}
.spot-thumb{width:38px;height:38px;border-radius:var(--r1);background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.spot-info-col{flex:1;min-width:0}
.spot-name{font-size:13px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot-meta{display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap}
.spot-time{font-size:11px;color:var(--t2)}
.spot-note{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.spot-acts{display:flex;gap:4px;flex-shrink:0}
.btn-map{padding:4px 8px;font-size:11px;border:0.5px solid var(--green);color:var(--green);border-radius:20px;cursor:pointer;background:none;font-family:inherit}
.btn-map:hover{background:var(--gl)}
.btn-sm{padding:4px 7px;font-size:11px;border:0.5px solid var(--bd2);color:var(--t2);border-radius:var(--r1);cursor:pointer;background:none;font-family:inherit}
.add-spot-row{padding:9px 13px;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--t3);font-size:12px;border-top:0.5px dashed var(--bd)}
.add-spot-row:hover{color:var(--green);background:var(--bg2)}
.add-spot-plus{width:20px;height:20px;border-radius:50%;border:1px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}

/* Weather bar */
.weather-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.weather-bar::-webkit-scrollbar{display:none}
.weather-chip-big{flex-shrink:0;background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--r1);padding:8px 10px;text-align:center;min-width:60px}
.wc-day{font-size:10px;color:var(--t2)}
.wc-icon{font-size:20px;margin:2px 0}
.wc-temp{font-size:11px;font-weight:600;color:var(--t1)}
.wc-desc{font-size:10px;color:var(--t3);margin-top:1px}
.weather-note{font-size:11px;color:var(--blue);margin-bottom:10px;padding:7px 10px;background:var(--bl);border-radius:var(--r1)}

/* Hotel / Flight */
.hotel-card{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--r2);padding:12px 14px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start}
.hotel-icon{width:40px;height:40px;border-radius:var(--r1);background:var(--bl);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hotel-name{font-size:13px;font-weight:600;color:var(--t1)}
.hotel-dates{font-size:11px;color:var(--t2);margin-top:2px}
.hotel-addr{font-size:11px;color:var(--blue);margin-top:3px;cursor:pointer}
.hotel-addr:hover{text-decoration:underline}
.hbadge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;background:var(--gl);color:var(--gd);margin-top:5px}
.hbadge.pending{background:#FAEEDA;color:#854F0B}
.flight-card{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--r2);padding:12px 14px;margin-bottom:9px}
.f-ap{font-size:20px;font-weight:700;color:var(--t1)}
.f-mid{flex:1;text-align:center;position:relative}
.f-line{height:1px;background:var(--bd2)}
.f-dur{font-size:10px;color:var(--t3);position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--bg);padding:0 4px;white-space:nowrap}
.f-time{font-size:12px;color:var(--t2);margin-top:2px}
.f-meta{display:flex;gap:8px;margin-top:8px;padding-top:8px;border-top:0.5px solid var(--bd);flex-wrap:wrap}
.f-detail{font-size:11px;color:var(--t2)}.f-detail span{color:var(--t1);font-weight:600}
.f-dir-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;background:var(--bl);color:var(--blue)}

/* Ledger */
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.sum-card{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--r1);padding:10px}
.sum-lbl{font-size:10px;color:var(--t2);margin-bottom:3px}
.sum-val{font-size:16px;font-weight:700;color:var(--t1)}
.sum-sub{font-size:10px;color:var(--t3);margin-top:1px}
.exp-row{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--r1);padding:9px 12px;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.exp-icon{width:30px;height:30px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.exp-name{font-size:13px;font-weight:600;color:var(--t1)}
.exp-meta{font-size:11px;color:var(--t2)}
.pay-badge{display:inline-block;padding:1px 6px;border-radius:20px;font-size:10px;margin-top:2px}
.pay-card-b{background:var(--bl);color:var(--blue)}
.pay-cash-b{background:#EAF3DE;color:#3B6D11}
.exp-amt{text-align:right;margin-left:auto;flex-shrink:0}
.exp-twn{font-size:13px;font-weight:600;color:var(--t1)}
.exp-orig{font-size:10px;color:var(--t3)}
.pie-wrap{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--r2);padding:14px;margin-bottom:14px}
.pie-title{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:12px}
.pie-inner{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pie-legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:120px}
.legend-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2)}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-pct{margin-left:auto;font-weight:600;color:var(--t1)}

/* Share / Permission panel */
.share-panel{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--r2);padding:14px;margin-bottom:12px}
.share-panel h4{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:10px}
.share-link-box{display:flex;gap:6px;margin-bottom:12px}
.share-link-input{flex:1;font-size:12px;padding:7px 10px;border:0.5px solid var(--bd2);border-radius:var(--r1);background:var(--bg2);color:var(--t2);font-family:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-btn{padding:7px 12px;background:var(--green);border:none;border-radius:var(--r1);color:#fff;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.perm-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--bd);font-size:13px}
.perm-row:last-child{border-bottom:none}
.perm-email{flex:1;color:var(--t1)}
.perm-role{font-size:11px;padding:2px 8px;border-radius:20px}
.perm-owner{background:var(--gl);color:var(--gd)}
.perm-editor{background:var(--bl);color:var(--blue)}
.perm-pending{background:#FAEEDA;color:#854F0B}
.perm-btn{padding:3px 8px;font-size:11px;border:0.5px solid var(--bd2);border-radius:var(--r1);cursor:pointer;background:none;font-family:inherit;color:var(--t2)}
.perm-btn.approve{border-color:var(--green);color:var(--green)}
.perm-btn.reject{border-color:#E24B4A;color:#E24B4A}

/* Buttons */
.btn-add{padding:6px 12px;background:var(--green);color:#fff;border:none;border-radius:var(--r1);font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-add:hover{background:var(--gd)}

/* Modal */
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);z-index:100;align-items:flex-end;justify-content:center}
@media(min-width:500px){.overlay{align-items:flex-start;padding-top:28px}}
.overlay.on{display:flex}
.modal{background:var(--bg);border-radius:var(--r2) var(--r2) 0 0;padding:18px 20px 32px;width:100%;max-width:420px;position:relative;max-height:92vh;overflow-y:auto}
@media(min-width:500px){.modal{border-radius:var(--r2);padding-bottom:20px}}
.modal-drag{width:36px;height:4px;background:var(--bd2);border-radius:2px;margin:0 auto 14px}
@media(min-width:500px){.modal-drag{display:none}}
.modal h3{font-size:15px;font-weight:700;color:var(--t1);margin-bottom:13px}
.fl{font-size:12px;color:var(--t2);margin-bottom:4px;display:block;margin-top:2px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.modal input,.modal select,.modal textarea{width:100%;font-size:14px;margin-bottom:10px;padding:9px 11px;border-radius:var(--r1);border:0.5px solid var(--bd2);background:var(--bg);color:var(--t1);font-family:inherit;outline:none;-webkit-appearance:none}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--green)}
.modal textarea{height:56px;resize:none}
.mbtns{display:flex;gap:8px;margin-top:6px}
.btn-cancel{flex:1;padding:10px;border:0.5px solid var(--bd2);border-radius:var(--r1);background:none;cursor:pointer;font-size:14px;color:var(--t2);font-family:inherit}
.btn-save{flex:1;padding:10px;background:var(--green);border:none;border-radius:var(--r1);color:#fff;cursor:pointer;font-size:14px;font-family:inherit;font-weight:600}
.btn-del{flex:1;padding:10px;border:0.5px solid #E24B4A;border-radius:var(--r1);background:none;cursor:pointer;font-size:14px;color:#E24B4A;font-family:inherit}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--t3)}
.emoji-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.eopt{width:32px;height:32px;border-radius:var(--r1);border:0.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.eopt.sel{border-color:var(--green);background:var(--gl)}
.empty-state{text-align:center;padding:32px 20px;color:var(--t3);font-size:13px}
.info-box{background:var(--gl);border-radius:var(--r1);padding:8px 10px;font-size:11px;color:var(--gd);margin-bottom:10px}

/* Read-only banner */
.readonly-banner{background:#FAEEDA;border-bottom:1px solid #f0c040;padding:8px 16px;font-size:12px;color:#856404;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.request-edit-btn{padding:4px 12px;background:#856404;border:none;border-radius:20px;color:#fff;font-size:11px;cursor:pointer;font-family:inherit}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* Loading */
.loading{text-align:center;padding:60px 20px;color:var(--t3);font-size:14px}
.spinner{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="readonly-banner" style="display:none" class="readonly-banner">
  👁 你正在以唯讀模式查看此行程（記帳資訊已隱藏）
  <button class="request-edit-btn" onclick="requestEdit()">申請編輯權限</button>
</div>

<div class="app" id="root">
  <div class="topbar">
    <div class="logo">旅<span>GO</span></div>
    <div class="user-pill" id="upill" onclick="handleUserClick()">
      <div class="avatar" id="uav">G</div>
      <span id="uname">載入中...</span>
    </div>
  </div>
  <div class="nav" id="mainnav" style="display:none">
    <button class="nb on" onclick="switchNav(this)">我的行程</button>
  </div>
  <div class="body">
    <div id="view-loading" class="view on"><div class="loading"><div class="spinner"></div>載入中...</div></div>
    <div id="view-login" class="view">
      <div class="login-screen">
        <div class="big-icon">✈️</div>
        <h1>旅GO</h1>
        <p>登入後開始規劃你的旅程<br>行程・住宿・航班・記帳，換裝置也看得到</p>
        <button class="btn-google" onclick="signInWithGoogle()">

/* ─── Weather ─── */
const weatherCache = {};
async function fetchWeather(trip) {
  const city = trip.location || trip.name;
  if (weatherCache[trip.id]) return weatherCache[trip.id];
  const startDate = new Date(trip.startDate);
  const today = new Date();
  const diffDays = Math.ceil((startDate - today) / 86400000);
  if (diffDays > 5 || diffDays < -1) return null; // too far
  try {
    const res = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(city)}&appid=${OWM_KEY}&units=metric&lang=zh_tw&cnt=40`);
    const data = await res.json();
    if (data.cod !== '200') return null;
    // group by day
    const days = {};
    data.list.forEach(item => {
      const d = item.dt_txt.split(' ')[0];
      if (!days[d]) days[d] = [];
      days[d].push(item);
    });
    const result = {};
    Object.keys(days).forEach(d => {
      const items = days[d];
      const icons = {Clear:'☀️',Clouds:'⛅',Rain:'🌧',Drizzle:'🌦',Thunderstorm:'⛈',Snow:'❄️',Mist:'🌫',Fog:'🌫'};
      const main = items[Math.floor(items.length/2)].weather[0].main;
      result[d] = {
        icon: icons[main] || '🌤',
        desc: items[Math.floor(items.length/2)].weather[0].description,
        hi: Math.round(Math.max(...items.map(i=>i.main.temp_max))),
        lo: Math.round(Math.min(...items.map(i=>i.main.temp_min)))
      };
    });
    weatherCache[trip.id] = result;
    return result;
  } catch(e) { return null; }
}

function getDateStr(startDate, dayNum) {
  const d = new Date(startDate);
  d.setDate(d.getDate() + dayNum - 1);
  return d.toISOString().split('T')[0];
}

/* ─── Itinerary ─── */
async function renderDays(trip) {
  const c = document.getElementById('sub-itinerary');
  const weather = await fetchWeather(trip);
  const start = new Date(trip.startDate);
  // weather bar
  let wbar = '';
  if (weather) {
    wbar = '<div class="weather-bar">';
    for (let d = 1; d <= trip.days; d++) {
      const dateStr = getDateStr(trip.startDate, d);
      const w = weather[dateStr];
      if (!w) continue;
      const dd = new Date(start); dd.setDate(dd.getDate()+d-1);
      wbar += `<div class="weather-chip-big"><div class="wc-day">${dd.getMonth()+1}/${dd.getDate()}</div><div class="wc-icon">${w.icon}</div><div class="wc-temp">${w.hi}°/${w.lo}°</div><div class="wc-desc">${w.desc}</div></div>`;
    }
    wbar += '</div>';
  } else {
    wbar = `<div class="weather-note">🌡 天氣預報將在出發前 5 天自動顯示（資料來源：OpenWeatherMap）</div>`;
  }

  let html = '';
  for (let d = 1; d <= trip.days; d++) {
    const dd = new Date(start); dd.setDate(dd.getDate()+d-1);
    const dlbl = `${dd.getMonth()+1}/${dd.getDate()}（${WDAYS[dd.getDay()]}）`;
    const dateStr = getDateStr(trip.startDate, d);
    const w = weather ? weather[dateStr] : null;
    const spots = (trip.spots && trip.spots[d]) || [];
    let sh = '';
    spots.forEach((s, si) => {
      const editable = !S.readOnly;
      sh += `<div class="spot-row ${editable?'draggable':''}" ${editable?`draggable="true" ondragstart="dndStart(event,${d},${si})" ondragover="dndOver(event)" ondrop="dndDrop(event,${d},${si},'${trip.id}')" ondragend="dndEnd(event)"`:''}>
        ${editable ? '<span class="drag-handle">⠿</span>' : ''}
        <div class="spot-thumb">${s.emoji}</div>
        <div class="spot-info-col">
          <div class="spot-name">${esc(s.name)}</div>
          <div class="spot-meta">
            <span class="spot-time">${s.time} – ${s.end}</span>
            ${s.note ? `<span class="spot-note">${esc(s.note)}</span>` : ''}
          </div>
        </div>
        <div class="spot-acts">
          <button class="btn-map" onclick="openMap('${escq(s.name)}')">地圖</button>
          ${editable ? `<button class="btn-sm" onclick="openEditSpot('${trip.id}',${d},${si})">編輯</button>` : ''}
        </div>
      </div>`;
    });
    html += `<div class="day-block">
      <div class="day-hd" onclick="toggleDay(this)">
        <div class="day-num">${d}</div>
        <div style="flex:1"><div class="day-label">第 ${d} 天</div><div class="day-date-lbl">${dlbl}</div></div>
        ${w ? `<div class="weather-chip">${w.icon} ${w.hi}°</div>` : ''}
        <div class="day-arr" style="margin-left:8px">▾</div>
      </div>
      <div class="day-body">
        ${sh}
        ${!S.readOnly ? `<div class="add-spot-row" onclick="openAddSpot('${trip.id}',${d})"><div class="add-spot-plus">+</div>新增景點</div>` : ''}
      </div>
    </div>`;
  }
  c.innerHTML = wbar + html;
}

window.toggleDay = el => {
  const body = el.nextElementSibling;
  const arr = el.querySelector('.day-arr');
  if (body.style.display === 'none') { body.style.display='block'; arr.textContent='▾'; }
  else { body.style.display='none'; arr.textContent='▸'; }
};

/* ─── DnD ─── */
window.dndStart = (e,day,idx) => { S.drag={srcDay:day,srcIdx:idx}; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; };
window.dndOver = e => e.preventDefault();
window.dndDrop = async (e,day,idx,tripId) => {
  e.preventDefault();
  const trip = S.trips.find(t=>t.id===tripId); if(!trip) return;
  const {srcDay,srcIdx} = S.drag;
  if(srcDay===day&&srcIdx===idx) return;
  const src = [...(trip.spots[srcDay]||[])];
  const tgt = srcDay===day ? src : [...(trip.spots[day]||[])];
  const item = src.splice(srcIdx,1)[0];
  if(srcDay===day) src.splice(idx,0,item); else tgt.splice(idx,0,item);
  trip.spots[srcDay]=src; trip.spots[day]=tgt;
  await saveTrip(trip);
  renderDays(trip);
};

/* ─── Firestore save ─── */
async function saveTrip(trip) {
  const ref = trip.shared
    ? doc(db, 'trips', trip.id)
    : doc(db, 'users', S.user.uid, 'trips', trip.id);
  await setDoc(ref, trip, {merge:true});
  // also save to master trips collection for sharing
  if (!trip.shared) await setDoc(doc(db,'trips',trip.id), trip, {merge:true});
}

/* ─── Ledger ─── */
async function renderLedger(trip) {
  const c=document.getElementById('sub-ledger');
  const exps=trip.expenses||[];
  const total=exps.reduce((s,e)=>s+e.amount,0);
  const card=exps.filter(e=>e.pay==='card').reduce((s,e)=>s+e.amount,0);
  const cash=total-card;
  let html=`<div class="row-hd"><div class="row-title">旅費記帳</div><button class="btn-add" onclick="openAddExp('${trip.id}')">＋ 新增</button></div>
    <div class="sum-grid">
      <div class="sum-card"><div class="sum-lbl">總支出（台幣）</div><div class="sum-val">NT$${total.toLocaleString()}</div><div class="sum-sub">${exps.length} 筆</div></div>
      <div class="sum-card"><div class="sum-lbl">刷卡</div><div class="sum-val">NT$${card.toLocaleString()}</div><div class="sum-sub">${exps.filter(e=>e.pay==='card').length} 筆</div></div>
      <div class="sum-card"><div class="sum-lbl">現金</div><div class="sum-val">NT$${cash.toLocaleString()}</div><div class="sum-sub">${exps.filter(e=>e.pay==='cash').length} 筆</div></div>
    </div>`;
  // pie chart
  if (exps.length > 0) {
    const cats={};
    exps.forEach(e=>{cats[e.cat]=(cats[e.cat]||0)+e.amount;});
    const entries=Object.keys(cats).map(k=>({cat:k,amt:cats[k]})).sort((a,b)=>b.amt-a.amt);
    const sz=120,cx=60,cy=60,r=50;let start=0,slices='';
    entries.forEach((e,i)=>{
      const pct=e.amt/total; const angle=pct*2*Math.PI;
      const x1=cx+r*Math.sin(start),y1=cy-r*Math.cos(start);
      const x2=cx+r*Math.sin(start+angle),y2=cy-r*Math.cos(start+angle);
      const lg=angle>Math.PI?1:0;
      slices+=`<path d="M${cx} ${cy} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${lg} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${CPIE[i%CPIE.length]}"/>`;
      start+=angle;
    });
    const legend=entries.map((e,i)=>`<div class="legend-row"><div class="legend-dot" style="background:${CPIE[i%CPIE.length]}"></div><span>${e.cat}</span><span class="legend-pct">${Math.round(e.amt/total*100)}%</span></div>`).join('');
    html+=`<div class="pie-wrap"><div class="pie-title">支出分類</div><div class="pie-inner">
      <svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="flex-shrink:0">${slices}</svg>
      <div class="pie-legend">${legend}</div></div></div>`;
  }
  if(!exps.length){html+=`<div class="empty-state">尚未新增支出<br><span style="font-size:24px;display:block;margin-top:8px">💰</span></div>`;}
  else exps.forEach((e,ei)=>{
    const bg=CBGS[e.cat]||'#F1EFE8';
    html+=`<div class="exp-row">
      <div class="exp-icon" style="background:${bg}">${e.icon}</div>
      <div style="flex:1;min-width:0"><div class="exp-name">${esc(e.name)}</div><div class="exp-meta">${e.date} · ${e.cat}</div>
      <span class="pay-badge ${e.pay==='card'?'pay-card-b':'pay-cash-b'}">${e.pay==='card'?'刷卡':'現金'}</span></div>
      <div class="exp-amt"><div class="exp-twn">NT$${e.amount.toLocaleString()}</div><div class="exp-orig">${e.orig}</div></div>
      <button class="btn-sm" onclick="doDelExp('${trip.id}',${ei})" style="margin-left:5px">✕</button>
    </div>`;
  });
  c.innerHTML=html;
}

      <button class="copy-btn" onclick="copyShareUrl()">複製</button>
    </div>
    <div style="font-size:13px;font-weight:600;color:var(--t1);margin-bottom:8px">權限管理</div>
    <div>${permRows}</div>
    <div class="mbtns" style="margin-top:12px"><button class="btn-cancel" onclick="closeModal()">關閉</button></div>`;
  document.getElementById('overlay').classList.add('on');
};

window.copyShareUrl = () => {
  const url=document.getElementById('share-url').value;
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>showToast('🔗 連結已複製！'));
  else { document.getElementById('share-url').select(); document.execCommand('copy'); showToast('🔗 連結已複製！'); }
};

window.requestEdit = async () => {
  if(!S.user){await window.signInWithGoogle();return;}
  const tripId=new URLSearchParams(location.search).get('trip');
  const tripRef=doc(db,'trips',tripId);
  const tripDoc=await getDoc(tripRef);
  if(!tripDoc.exists()) return;
  const trip=tripDoc.data();
  const perms=trip.permissions||{};
  perms[S.user.uid]={role:'pending',email:S.user.email,displayName:S.user.displayName||''};
  await setDoc(tripRef,{permissions:perms},{merge:true});
  showToast('✅ 已送出申請，等待擁有者核准');
  document.querySelector('.request-edit-btn').textContent='已送出申請';
  document.querySelector('.request-edit-btn').disabled=true;
};

window.approveEdit = async (tripId,uid,email) => {
  const tripRef=doc(db,'trips',tripId);
  const userTripRef=doc(db,'users',uid,'sharedTrips',tripId);
  const perms=(S.cur.permissions||{}); perms[uid]={role:'editor',email};
  await setDoc(tripRef,{permissions:perms},{merge:true});
  await setDoc(userTripRef,{tripId,grantedAt:Date.now()});
  S.cur.permissions=perms;
  openSharePanel(); showToast('✅ 已核准編輯權限');
};
window.rejectEdit = async (tripId,uid) => {
  const tripRef=doc(db,'trips',tripId);
  const perms=S.cur.permissions||{}; delete perms[uid];
  await setDoc(tripRef,{permissions:perms},{merge:true});
  S.cur.permissions=perms; openSharePanel();
};
window.revokeEdit = async (tripId,uid) => {
  const tripRef=doc(db,'trips',tripId);
  const perms=S.cur.permissions||{}; delete perms[uid];
  await setDoc(tripRef,{permissions:perms},{merge:true});
  await deleteDoc(doc(db,'users',uid,'sharedTrips',tripId));
  S.cur.permissions=perms; openSharePanel(); showToast('已撤銷編輯權限');
};

/* ─── PDF Download ─── */
window.downloadPDF = () => {
  const trip=S.cur; if(!trip) return;
  const start=new Date(trip.startDate);
  let html=`<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8">
    <style>
      body{font-family:sans-serif;color:#1a1a1a;padding:40px;max-width:800px;margin:0 auto;font-size:14px}
      h1{font-size:28px;color:#1D9E75;margin-bottom:4px}
      .sub{color:#6b6b6b;margin-bottom:32px;font-size:14px}
      h2{font-size:18px;color:#1D9E75;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid #E1F5EE}
      h3{font-size:14px;font-weight:600;margin:14px 0 6px;color:#333}
      .day-block{margin-bottom:18px;page-break-inside:avoid}
      .spot{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0}
      .spot-icon{font-size:20px;width:30px;flex-shrink:0}
      .spot-name{font-weight:600}
      .spot-time{color:#6b6b6b;font-size:12px}
      .spot-note{color:#9b9b9b;font-size:12px}
      .hotel-row{padding:10px 0;border-bottom:1px solid #f0f0f0}
      .hotel-name{font-weight:600}
      .hotel-info{color:#6b6b6b;font-size:12px;margin-top:2px}
      .flight-card{border:1px solid #e0e0e0;border-radius:8px;padding:12px;margin-bottom:10px;page-break-inside:avoid}
      .flight-route{display:flex;align-items:center;gap:12px;margin-bottom:8px}
      .ap{font-size:22px;font-weight:700}
      .arrow{flex:1;text-align:center;color:#9b9b9b;font-size:12px}
      .flight-info{display:flex;gap:16px;font-size:12px;color:#6b6b6b}
      .cover{text-align:center;padding:40px 0;border-bottom:2px solid #E1F5EE;margin-bottom:32px}
      .cover-icon{font-size:64px;margin-bottom:12px}
      .cover h1{font-size:32px}
      @media print{body{padding:20px}.cover{page-break-after:always}}
    </style></head><body>
    <div class="cover">
      <div class="cover-icon">${trip.emoji}</div>
      <h1>${esc(trip.name)}</h1>
      <div class="sub">
        ${new Date(trip.startDate).toLocaleDateString('zh-TW')} 出發 · ${trip.days}天${trip.nights}夜
        ${trip.location ? `· ${esc(trip.location)}` : ''}
      </div>
    </div>`;

  // Itinerary
  html += `<h2>📅 行程安排</h2>`;
  for(let d=1;d<=trip.days;d++){
    const dd=new Date(start); dd.setDate(dd.getDate()+d-1);
    const spots=(trip.spots&&trip.spots[d])||[];
    html+=`<div class="day-block"><h3>第 ${d} 天 · ${dd.getMonth()+1}/${dd.getDate()}（${WDAYS[dd.getDay()]}）</h3>`;
    if(!spots.length){html+=`<div style="color:#9b9b9b;font-size:12px;padding:6px 0">尚無景點</div>`;}
    else spots.forEach(s=>{
      html+=`<div class="spot"><div class="spot-icon">${s.emoji}</div><div>
        <div class="spot-name">${esc(s.name)}</div>
        <div class="spot-time">${s.time} – ${s.end}</div>
        ${s.note?`<div class="spot-note">${esc(s.note)}</div>`:''}
      </div></div>`;
    });
    html+=`</div>`;
  }

  // Hotels
  if(trip.hotels&&trip.hotels.length){
    html+=`<h2>🏨 住宿安排</h2>`;
    trip.hotels.forEach(h=>{
      const ci=new Date(h.checkin),co=new Date(h.checkout); const n=Math.round((co-ci)/86400000);
      html+=`<div class="hotel-row"><div class="hotel-name">${h.icon} ${esc(h.name)}</div>
        <div class="hotel-info">${ci.getMonth()+1}/${ci.getDate()} 入住 → ${co.getMonth()+1}/${co.getDate()} 退房 · ${n} 晚</div>
        ${h.addr?`<div class="hotel-info">📍 ${esc(h.addr)}</div>`:''}
        <div class="hotel-info">${h.confirmed?'✅ 已確認':'⏳ 待確認'}</div>
      </div>`;
    });
  }

  // Flights
  if(trip.flights&&trip.flights.length){
    html+=`<h2>✈️ 航班資訊</h2>`;
    trip.flights.forEach(f=>{
      html+=`<div class="flight-card">
        <div style="font-size:11px;color:#185FA5;margin-bottom:6px">${f.dir}</div>
        <div class="flight-route">
          <div><div class="ap">${f.from}</div><div style="font-size:12px;color:#6b6b6b">${f.dep}</div></div>
          <div class="arrow">──── ${f.dur} ────></div>
          <div style="text-align:right"><div class="ap">${f.to}</div><div style="font-size:12px;color:#6b6b6b">${f.arr}</div></div>
        </div>
        <div class="flight-info">
          <span>📅 ${f.date}</span><span>✈ ${f.no}</span><span>💺 ${f.cabin} ${f.seat}</span>
        </div></div>`;
    });
  }

  html+=`<div style="text-align:center;color:#9b9b9b;font-size:11px;margin-top:40px;padding-top:20px;border-top:1px solid #f0f0f0">由 旅GO 產生 · ${new Date().toLocaleDateString('zh-TW')}</div>
  </body></html>`;

  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');
  if(w){setTimeout(()=>{w.print();URL.revokeObjectURL(url);},800);}
  else{const a=document.createElement('a');a.href=url;a.download=`${trip.name}.html`;a.click();URL.revokeObjectURL(url);}
  showToast('📄 PDF 列印視窗已開啟');
};

/* ─── Helpers ─── */
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));document.getElementById(id).classList.add('on');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function esca(s){return esc(s);}
function escq(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
